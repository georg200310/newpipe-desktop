name: Windows desktop MSI build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/windows-desktop-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows MSI installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Explicit packages avoid the obsolete SDK package named "tools".
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 37.0 platform
        shell: pwsh
        run: |
          sdkmanager "platforms;android-37.0"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install Android SDK platform 37.0."
          }

      - name: Set up WiX Toolset 3
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $wixBin = Get-ChildItem -Path $programFilesX86 -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "WiX Toolset v3*" } |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { (Test-Path (Join-Path $_ "candle.exe")) -and (Test-Path (Join-Path $_ "light.exe")) } |
            Select-Object -First 1

          if (-not $wixBin) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Could not install WiX Toolset 3.14.1."
            }
            $wixBin = Join-Path $programFilesX86 "WiX Toolset v3.14\bin"
          }

          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset candle.exe was not found in $wixBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build Windows MSI installer
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi --no-daemon --stacktrace

      - name: Collect MSI installer
        shell: pwsh
        run: |
          $binaryRoot = Join-Path $PWD "desktopApp\build\compose\binaries"
          if (!(Test-Path $binaryRoot)) {
            throw "Gradle did not create the Compose binaries directory."
          }

          $msi = Get-ChildItem -Path $binaryRoot -Filter "*.msi" -File -Recurse |
            Select-Object -First 1

          if ($null -eq $msi) {
            Get-ChildItem -Path $binaryRoot -Recurse | Select-Object FullName
            throw "No MSI installer was created."
          }

          Copy-Item -Path $msi.FullName -Destination (Join-Path $PWD "NewPipe-Desktop-Windows-Setup.msi") -Force

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Desktop-Windows-MSI
          path: NewPipe-Desktop-Windows-Setup.msi
          if-no-files-found: error
          retention-days: 14
